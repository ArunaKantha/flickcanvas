name: FlickCanvas Auto Post

on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  auto-post:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger FlickCanvas Auto Post
        run: |
          curl -f -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://flickcanvas.vercel.app/api/facebook/auto-post"